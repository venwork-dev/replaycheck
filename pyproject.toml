[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "replaycheck"
version = "0.1.0"
description = "Find the bugs that only appear when an event is delivered twice."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
keywords = ["event-driven", "idempotency", "property-testing", "replay"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/venwork-dev/replaycheck"
Repository = "https://github.com/venwork-dev/replaycheck"
Issues = "https://github.com/venwork-dev/replaycheck/issues"

[project.optional-dependencies]
dev = ["pytest>=7", "setuptools>=61", "wheel"]

[project.scripts]
replaycheck = "replaycheck.__main__:main"

[tool.setuptools.packages.find]
include = ["replaycheck*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
