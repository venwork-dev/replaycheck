[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "replaycheck"
version = "0.1.0"
description = "Find the bugs that only appear when an event is delivered twice."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
replaycheck = "replaycheck.__main__:main"

[tool.setuptools.packages.find]
include = ["replaycheck*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
